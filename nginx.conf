server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Spring Boot REST API — Phase 2-6 routes (longer prefix wins over /api/)
    location /api/v1/ {
        proxy_pass         http://spring-app:8080/api/v1/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_buffering    off;   # required for SSE (live-chat streaming)
    }

    # WhatsApp webhook → Spring Boot
    location /webhook {
        proxy_pass         http://spring-app:8080/webhook;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # React SPA — all other paths fall through to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
