name: Project Control UI

on:
  push:
    branches:
      - feature/project-control-modulith-ui
      - feature/project-control-complete-ui
    paths:
      - 'project-control-ui/**'
      - '.github/workflows/project-control-ui.yml'
  pull_request:
    paths:
      - 'project-control-ui/**'
      - '.github/workflows/project-control-ui.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-control-ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: project-control-ui/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Build production container
        run: docker build -t project-control-ui:ci .

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Project Control UI
        uses: actions/checkout@v5

      - name: Checkout Project Control backend
        uses: actions/checkout@v5
        with:
          repository: Yashu7372/whatsapp-bot
          ref: feature/project-control-modulith-foundation
          path: backend

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/project-control-service/pom.xml

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: project-control-ui/package.json

      - name: Install UI dependencies
        working-directory: project-control-ui
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: project-control-ui
        run: npx playwright install --with-deps chromium

      - name: Start backend
        working-directory: backend/project-control-service
        run: |
          nohup mvn -B -Dspring-boot.run.profiles=local spring-boot:run > "$RUNNER_TEMP/project-control-backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/project-control-backend.pid"

      - name: Wait for backend
        run: |
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8080/api/auth/csrf >/dev/null; then
              echo "Project Control backend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready"
          cat "$RUNNER_TEMP/project-control-backend.log"
          exit 1

      - name: Start UI
        working-directory: project-control-ui
        run: |
          nohup npm run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/project-control-ui.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/project-control-ui.pid"

      - name: Wait for UI
        run: |
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:5174 >/dev/null; then
              echo "Project Control UI is ready"
              exit 0
            fi
            sleep 2
          done
          echo "UI did not become ready"
          cat "$RUNNER_TEMP/project-control-ui.log"
          exit 1

      - name: Run authenticated workflow E2E
        working-directory: project-control-ui
        run: npm run test:e2e

      - name: Collect runtime logs
        if: always()
        run: |
          mkdir -p project-control-ui/test-output
          cp "$RUNNER_TEMP/project-control-backend.log" project-control-ui/test-output/backend.log 2>/dev/null || true
          cp "$RUNNER_TEMP/project-control-ui.log" project-control-ui/test-output/ui.log 2>/dev/null || true

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-control-playwright-evidence
          if-no-files-found: ignore
          path: |
            project-control-ui/playwright-report/
            project-control-ui/test-results/
            project-control-ui/test-output/
