name: Frontend CI

on:
  pull_request:
    branches: [develop, main, feature/enterprise-document-control]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: TypeScript build and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: TypeScript and Vite build
        run: npm run build

      - name: Lint
        run: npm run lint
