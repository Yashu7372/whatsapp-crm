name: Frontend CI

on:
  pull_request:
    branches: [develop, main, feature/enterprise-document-control]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: TypeScript build and feature lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: TypeScript and Vite build
        run: npm run build
      # Lints the enterprise area as a directory rather than a hand-maintained file list. The old
      # allowlist silently excluded any new file until someone remembered to add it, which is how
      # lint errors reached the branch in files that were nominally covered.
      - name: Lint enterprise and app entrypoint
        run: npx eslint src/App.tsx src/enterprise
