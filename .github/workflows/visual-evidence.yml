name: Enterprise Visual Evidence

on:
  push:
    branches: [feature/enterprise-document-control]
    paths:
      - 'src/**'
      - 'scripts/capture-enterprise-evidence.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/visual-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enterprise-visual-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Verify enterprise drill-down and capture screenshots
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/enterprise-document-control

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build enterprise frontend
        run: npm run build

      - name: Lint enterprise frontend
        run: npx eslint src/App.tsx src/enterprise scripts/capture-enterprise-evidence.mjs

      - name: Capture deterministic enterprise evidence
        run: npm run e2e:visual

      - name: Verify screenshots exist
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/screenshots/01-portfolio-admin.png
          test -s docs/screenshots/02-project-drilldown-admin.png
          test -s docs/screenshots/03-work-item-evidence-admin.png
          test -s docs/screenshots/04-project-drilldown-worker-restricted.png

      - name: Upload screenshots as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-project-delivery-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Commit refreshed screenshots to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/*.png
          if git diff --cached --quiet; then
            echo 'Screenshots already match the current UI.'
            exit 0
          fi
          git commit -m 'refresh enterprise visual evidence [skip ci]'
          git push origin HEAD:feature/enterprise-document-control
